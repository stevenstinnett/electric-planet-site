<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electric Planet – Upload Portal</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f6fa;
      margin: 0;
      padding: 40px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #003366;
      margin-bottom: 20px;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"],
    input[type="email"],
    input[type="file"],
    textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      width: 100%;
    }

    input[type="submit"] {
      background-color: #0066cc;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #004c99;
    }

    .note {
      font-size: 14px;
      color: #555;
      margin-top: -10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Electric Planet Upload Portal</h1>

    <form 
      name="electric-planet-upload"
      method="POST"
      data-netlify="true"
      enctype="multipart/form-data"
      action="/success2.html">

      <input type="hidden" name="form-name" value="electric-planet-upload">

      <label>Your Name</label>
      <input type="text" name="name" required>

      <label>Your Email</label>
      <input type="email" name="email" required>

      <label>Upload File</label>
      <input type="file" name="file" required>

      <p class="note">Accepted: images, PDFs, documents, audio, video.</p>

      <input type="submit" value="Submit Upload">
    </form>
  </div>
</body>
</html>
