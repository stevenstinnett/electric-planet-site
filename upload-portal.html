<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Planet Upload Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #001A33;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #01264d;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #3AAFFF;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }

        input[type="file"] {
            background: #fff;
            color: #000;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background-color: #3AAFFF;
            color: #001A33;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #6bc6ff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Electric Planet Upload Portal</h1>
<form 
    name="electric-planet-upload"
    method="POST"
    enctype="multipart/form-data"
    action="/.netlify/functions/upload-handler">

    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" required>

    <label for="gps">GPS Coordinates</label>
    <input type="text" id="gps" name="gps" placeholder="Latitude, Longitude" required>

    <label for="topic">Science Topic</label>
    <input type="text" id="topic" name="topic" placeholder="River, geology, insects, weather..." required>

    <label for="notes">Optional Notes</label>
    <textarea id="notes" name="notes" rows="4" placeholder="Anything you'd like to add..."></textarea>

    <label for="file">Upload Photo</label>
    <input type="file" id="file" name="file" accept="image/*" required>

    <button type="submit">Submit</button>
</form>

<div id="statusBox"></div>
<script src="script.js"></script>

</body>
</html>
